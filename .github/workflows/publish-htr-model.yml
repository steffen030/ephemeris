name: Publish HTR model release

on:
  push:
    tags:
      - "htr-model-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: htr-model-v1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure asset present
        run: |
          test -f assets/htr/ephemeris-htr-v1.zip
          unzip -l assets/htr/ephemeris-htr-v1.zip

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HTR model v1 (OnlineHTR IAM-OnDB)
          body: |
            Online handwriting recognition model for Ephemeris stroke HTR.

            ## Asset
            - `ephemeris-htr-v1.zip` — `model.onnx`, `charset.txt`, `meta.json` (blank_index=0, NTC dx/dy/dt/n)

            ## Source
            PellelNitram/OnlineHTR checkpoint `dataIAMOnDB_featuresLinInterpol20DxDyDtN_decoderGreedy` (val_loss=0.2650).

            In-app: Settings → Handwriting → Download.
            Rebuild: `ONLINE_HTR_ROOT=… ./scripts/export-htr-model.sh`
          files: assets/htr/ephemeris-htr-v1.zip
          fail_on_unmatched_files: true
