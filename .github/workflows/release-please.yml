name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Workspace crates inherit [workspace.package].version; after release-please
  # bumps Cargo.toml on the Release PR branch, refresh Cargo.lock in this same
  # workflow run (avoids a pull_request workflow that sits in "waiting for approval"
  # when the PR is opened by github-actions[bot]).
  sync-lockfile:
    name: Sync Cargo.lock
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock after version bump"
          git push

  # Same push also starts ci.yml; do not package until that run is green.
  wait-ci:
    name: Wait for CI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Waiting for CI (ci.yml) on $SHA ..."
          RUN_ID=""
          for i in $(seq 1 90); do
            RUN_ID="$(gh run list --workflow=ci.yml --commit="$SHA" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$RUN_ID" ]]; then
              echo "Found CI run $RUN_ID"
              break
            fi
            echo "CI run not listed yet (attempt $i/90)..."
            sleep 10
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No CI run found for $SHA within timeout" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

  publish:
    name: Build and publish
    needs: [release-please, wait-ci]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
