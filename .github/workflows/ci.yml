name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - name: Run workspace tests
        run: cargo test --workspace

  cross-compile:
    name: Cross-compile (aarch64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-aarch64
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build aarch64 release binary
        run: cross build --target aarch64-unknown-linux-gnu -p ephemeris-app --release
      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ephemeris-aarch64-linux
          path: target/aarch64-unknown-linux-gnu/release/ephemeris
          if-no-files-found: error
