name: Release Please lockfile sync

# Workspace crates inherit [workspace.package].version; after release-please
# bumps Cargo.toml, refresh Cargo.lock on the Release PR branch.
on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - .release-please-manifest.json

permissions:
  contents: write

jobs:
  sync-lockfile:
    name: Sync Cargo.lock
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock after version bump"
          git push
