[package]
name = "ephemeris-core"
description = "Domain models and platform-agnostic logic for Ephemeris"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["fs"]
# `fs` enables the JSON-on-disk StrokeStore (desktop dev + persist/reload tests).
fs = []

[dependencies]
ephemeris-pal = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
