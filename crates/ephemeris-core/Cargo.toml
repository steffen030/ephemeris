[package]
name = "ephemeris-core"
description = "Domain models and platform-agnostic logic for Ephemeris"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["fs"]
# `fs` enables the JSON-on-disk StrokeStore (desktop dev + persist/reload tests).
fs = []
# `sqlite` enables the SQLite-backed storage layer (rusqlite, bundled libsqlite3).
sqlite = []
# `webdav` enables the WebDAV sync backend (pulls in reqwest_dav + bytes).
# Not included in the default build so that the offline/headless build stays
# network-free and link-time-lean.
webdav = ["dep:reqwest_dav", "dep:bytes"]
# `ics` enables HTTPS ICS feed fetching (pulls in reqwest).
ics = ["dep:reqwest"]
# `caldav` enables thin CalDAV discovery + calendar-query (pulls in reqwest).
caldav = ["dep:reqwest"]
# `ocr` enables RasterOcrTranscriber's Tesseract CLI backend (system `tesseract`
# + tessdata at runtime). Without this feature the type still exists but is a
# NoOp — desktop CI can skip OCR without a system dependency.
ocr = []
# `htr` enables StrokeHtrTranscriber's RTen ONNX runtime. Model weights are
# downloaded at runtime (Settings); CI can omit this feature.
htr = ["dep:rten", "dep:rten-tensor"]

[[bin]]
name = "htr-eval"
path = "src/bin/htr-eval.rs"
required-features = ["htr"]

[dependencies]
ephemeris-pal = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
icalendar = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
printpdf = { workspace = true }
# Optional — activated only when the `webdav` feature is enabled.
reqwest_dav = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# Optional — activated only when the `ics` feature is enabled.
reqwest = { workspace = true, optional = true }
# Optional — online stroke HTR inference (ephemeris-5g2).
rten = { workspace = true, optional = true }
rten-tensor = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
