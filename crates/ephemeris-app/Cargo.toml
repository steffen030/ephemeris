[package]
name = "ephemeris-app"
description = "Ephemeris application binary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ephemeris"
path = "src/main.rs"

# Metadata for cargo-deb / packaging docs. CI builds the .deb via
# scripts/build-deb.sh from a cross-compiled binary (see docs/releasing.md).
[package.metadata.deb]
name = "ephemeris"
maintainer = "Steffen Galan <steffen.galan@gmail.com>"
section = "utils"
priority = "optional"
depends = "libxkbcommon0, libwayland-client0, tesseract-ocr, tesseract-ocr-eng"
recommends = "tesseract-ocr-deu"
assets = [
    ["target/release/ephemeris", "usr/bin/ephemeris", "755"],
    ["packaging/debian/ephemeris.desktop", "usr/share/applications/ephemeris.desktop", "644"],
    ["packaging/debian/ephemeris.svg", "usr/share/icons/hicolor/scalable/apps/ephemeris.svg", "644"],
]

[dev-dependencies]
tempfile = "3"

[dependencies]
chrono = { workspace = true }
ephemeris-core = { workspace = true, features = ["ics", "ocr"] }
ephemeris-pal  = { workspace = true }
ephemeris-ui   = { workspace = true }
log = { workspace = true }
slint = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
winit = { workspace = true }
cpal    = { workspace = true }
hound   = { workspace = true }
reqwest = { workspace = true }
